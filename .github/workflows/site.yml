name: Site

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. A newer PR run replaces an older one; deploys on main queue instead.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# PR code runs only in `build`, which holds no secret. The other jobs never check out the
# PR or install anything: they publish the `site-dist` artifact with a pinned wrangler.
jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      # The Cloudflare plugin writes the deploy config under .wrangler/, and dist/client
      # carries .assetsignore; both are hidden, and wrangler cannot publish without them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error

  preview-publish:
    needs: build
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
      - id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        # wrangler 4.147.0 prints its upload log before the JSON object on stdout, so the
        # object is read from its opening brace line onward.
        run: |
          npx --yes wrangler@4.147.0 preview --name "pr-${PR_NUMBER}" --json | tee "$RUNNER_TEMP/preview.out"
          url=$(node -e '
            const out = require("fs").readFileSync(process.argv[1], "utf8")
            const start = out.search(/^\{$/m)
            if (start < 0) throw new Error("no JSON object in the wrangler preview output")
            const url = JSON.parse(out.slice(start)).preview?.urls?.[0]
            if (!url) throw new Error("the preview has no URL")
            console.log(url.replace(/\/$/, ""))
          ' "$RUNNER_TEMP/preview.out")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$PREVIEW_URL/genie"
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- site-preview -->'
          printf '%s\nSite preview: %s\n\nBuilt from %s. Chat shows an error on previews, which carry no gateway token.\n' \
            "$marker" "$PREVIEW_URL" "$HEAD_SHA" > "$RUNNER_TEMP/comment.md"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
      # The verify script comes from the pushed main commit; the checkout replaces the
      # downloaded files, which the deploy no longer needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://automagik-docs.felipehowit.workers.dev/genie
          node scripts/verify-site.mjs https://automagik-docs.felipehowit.workers.dev

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No checkout means no wrangler config, so the Worker is named on the command line.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: npx --yes wrangler@4.147.0 preview delete --name "pr-${PR_NUMBER}" --worker-name automagik-docs --skip-confirmation
