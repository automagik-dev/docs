name: Site

# A push to main that changes only the chat gateway deploys from chat.yml and leaves the site
# alone. Pull requests are not filtered, so the site's checks report on every PR.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['gateway/**', '.github/workflows/chat.yml']

permissions:
  contents: read

# One run per ref. A newer PR run replaces an older one; deploys on main queue instead.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# `build` runs the PR code and holds no secret. `deploy` holds the token only on its wrangler
# step, which publishes the `site-dist` artifact after the checked-out main pins its config.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails a PR whose build config drifts from scripts/expected-wrangler.json, before main.
      - run: node scripts/check-deploy-config.mjs .
      - run: npm run verify
      # Brand styles and the CSS canaries on holocron's markup, in a real browser.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-check.mjs --serve --all
      # dist/client/.assetsignore is hidden, and wrangler cannot publish without it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Outside the checkout, so wrangler finds no wrangler.jsonc above the artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: ${{ runner.temp }}/site/dist
      # wrangler runs any build.command in the artifact's config with the token set, so the
      # config must equal the expected copy and the pointer is written here, before wrangler.
      - run: node scripts/check-deploy-config.mjs "$RUNNER_TEMP/site"
      - working-directory: ${{ runner.temp }}/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --name automagik-docs
      - run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://automagik-docs.felipehowit.workers.dev/genie
          # While a deploy rolls out, requests are answered by the previous or the new version, so a
          # page and its hashed assets can come from different versions and 404. Retry across that window.
          for attempt in 1 2 3 4 5 6; do
            node scripts/verify-site.mjs https://automagik-docs.felipehowit.workers.dev && exit 0
            [ "$attempt" -lt 6 ] || break
            echo "verify-site: attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1
